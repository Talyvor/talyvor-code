name: Publish extension

# Publishes the VS Code extension to the Marketplace as talyvor.talyvor-code.
#
# Run it from the Actions tab (workflow_dispatch), or push a v* tag. It holds no Marketplace token:
# the job runs in environment marketplace-publish, trades its GitHub OIDC token for one belonging to
# the managed identity talyvor-marketplace-publisher, and vsce publishes as that identity, which is a
# Contributor on the `talyvor` publisher (marketplace-identity.yaml prints the id to add). A tag must
# name the version in extension/package.json — vsce publishes that version, so a mismatch would
# publish something the tag does not describe.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: a tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(node -p "require('./extension/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but extension/package.json is ${want} — bump the version first"
            exit 1
          fi

      - run: cd extension && npm ci
      - run: cd extension && npm run compile
      - run: cd extension && npm run test:unit
      - run: cd extension && npm run package
      - run: cd extension && ./scripts/check-vsix-listing.sh ./talyvor-code-*.vsix ./package.json

      # Logged in last so the token is fresh when vsce asks the Azure CLI for one.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Publishes the exact .vsix the steps above built and checked, not a fresh repackage, with the
      # vsce the lockfile pins: `--no` makes npx fail rather than download one if it is missing.
      - name: publish to the Marketplace
        run: cd extension && npx --no -- vsce publish --azure-credential --no-dependencies --packagePath ./talyvor-code-*.vsix
